<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Audit Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .audit-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .audit-card:active { transform: scale(0.97); }
        .status-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase; font-weight: 700; }
    </style>
</head>
<body>
    <header class="sticky top-0 z-50 bg-slate-900 text-white px-6 py-4 shadow-lg border-b border-slate-800">
        <div class="flex items-center justify-between max-w-5xl mx-auto">
            <h1 class="text-lg font-bold">Audit Central</h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-8 pb-24">
        <div id="audit-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
    </main>

    <script>
        const dashboard = {
            audits: [
                { id: 'checkin', name: 'Front Desk Check-In', file: 'checkin.html', icon: 'fa-bell-concierge', color: 'bg-sky-500', desc: 'Guest arrival standards' },
                { id: 'guestroom', name: 'Guest Room Audit', file: 'guestroom.html', icon: 'fa-bed', color: 'bg-indigo-600', desc: 'Room quality control' },
                { id: 'wellness', name: 'Spa & Wellness Audit', file: 'wellness.html', icon: 'fa-spa', color: 'bg-indigo-600', desc: 'Complete spa and fitness audit' }
            ],

            init() {
                const container = document.getElementById('audit-grid');
                this.audits.forEach(audit => {
                    const card = document.createElement('div');
                    card.className = 'audit-card group bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md cursor-pointer';
                    card.onclick = () => window.location.href = audit.file;
                    card.innerHTML = `
                        <div class="${audit.color} text-white p-3 rounded-xl mb-4 inline-block">
                            <i class="fa-solid ${audit.icon}"></i>
                        </div>
                        <h3 class="font-bold text-slate-800">${audit.name}</h3>
                        <p class="text-[11px] text-slate-500">${audit.desc}</p>
                    `;
                    container.appendChild(card);
                });
            }
        };
        window.onload = () => dashboard.init();
    </script>
</body>
</html>
